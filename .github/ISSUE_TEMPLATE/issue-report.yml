name: Issue report
description: Report a bug, problem, or missing functionality in KahunaCart
title: "[Issue]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue. Please provide enough detail for us to reproduce and investigate it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem.
      placeholder: A clear and concise summary of the issue
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly how to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Enter ...
        4. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: Describe the expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
      placeholder: Describe the actual result, including any error messages
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share any relevant environment details.
      placeholder: |
        - Device:
        - OS:
        - Browser:
        - App version:
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots, logs, links, or anything else that may help.
      placeholder: Any other relevant details
    validations:
      required: false
